          - heading "Krka River Stress-Ribbon Footbridge" [level=1] [ref=f21e37]
          - generic [ref=f21e39]: A new construction method and specialist equipment were developed to build Slovenia’s first stress-ribbon bridge; and the first in the world with tendons installed in grouted HDPE ducts.
