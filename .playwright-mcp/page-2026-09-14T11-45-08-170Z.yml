        - text: / Krka River Stress-Ribbon Footbridge
      - tabpanel [ref=f21e49]:
        - generic [ref=f21e52]:
          - paragraph [ref=f21e55]: Innovations in the design and construction of stress-ribbon bridges were successfully delivered on this footbridge in Slovenia, creating an elegant and durable structure in a sensitive setting.
          - list [ref=f21e57]:
            - listitem [ref=f21e58]:
              - generic [ref=f21e59]:
                - generic [ref=f21e60]: Client
                - generic [ref=f21e61]: City of Novo Mesto
            - listitem [ref=f21e62]:
              - generic [ref=f21e63]:
                - generic [ref=f21e64]: Delivery date
                - generic [ref=f21e65]: May 2023
            - listitem [ref=f21e66]:
              - generic [ref=f21e67]:
                - generic [ref=f21e68]: Joint venture contractor
                - generic [ref=f21e69]: CGP Novo Mesto/Freyssinet Adria
            - listitem [ref=f21e70]:
              - generic [ref=f21e71]:
                - generic [ref=f21e72]: Consulting engineers
                - generic [ref=f21e73]: Ponting Bridges, Pipenbaher Consulting Engineers
            - listitem [ref=f21e74]:
              - generic [ref=f21e75]:
                - generic [ref=f21e76]: Architect
                - generic [ref=f21e77]: Jereb & Budja Architects
        - generic [ref=f21e80]:
          - generic [ref=f21e83]:
            - heading "A competition-winning design for a stress-ribbon bridge for pedestrians and cyclists in Novo Mesto was built using novel construction techniques and equipment developed by Freyssinet." [level=2] [ref=f21e84]
            - paragraph [ref=f21e85]: It opens up new cycling and walking routes across the Krka River, directly connecting neighbourhoods for the first time and supporting the city’s aspiration to expand sustainable travel networks.
            - paragraph [ref=f21e86]: The design and construction of the new crossing builds on known technology for this type of simple catenary bridge, introducing HDPE grouted ducts to improve durability of the tendons that support it.
            - paragraph [ref=f21e87]: The footbridge is situated in a rural environment on the edge of the town, hence the commissioning authority sought a design that would have a minimum impact on the surroundings, to suit the low-key nature of its setting.
            - paragraph [ref=f21e88]: Design team Ponting, Pipenbaher Consulting Engineers and Jereb & Budja Architects came up with the winning proposal in an open competition in 2017; a 4 m-wide stress ribbon bridge in which the 420 mm-thick deck elements form a slender catenary between the tree-lined banks.
            - paragraph [ref=f21e89]: Members of the competition jury were impressed by the inventive structural concept and the way in which the elegant form of the bridge fitted effortlessly into the natural environment.
          - list [ref=f21e91]:
            - listitem [ref=f21e92]:
              - generic [ref=f21e93]:
                - generic [ref=f21e94]: 120.5m
                - generic [ref=f21e95]: Length of the main span
            - listitem [ref=f21e96]:
              - generic [ref=f21e97]:
                - generic [ref=f21e98]: 4m
                - generic [ref=f21e99]: Width of bridge
            - listitem [ref=f21e100]:
              - generic [ref=f21e101]:
                - generic [ref=f21e102]: 420mm
                - generic [ref=f21e103]: Depth of deck
            - listitem [ref=f21e104]:
              - generic [ref=f21e105]:
                - generic [ref=f21e106]: "46"
                - generic [ref=f21e107]: Total number of precast elements forming the deck
        - generic [ref=f21e111]:
          - paragraph [ref=f21e112]:
            - img "Slovenia footbridge" [ref=f21e113]
          - paragraph [ref=f21e114]: The bridge is formed of 46 precast concrete panels supported on six tendons to create a 120 m-long link between the two banks. Mass concrete blocks and anchored secant-pile walls create the foundations on each side into which the tendons are connected.
          - paragraph [ref=f21e115]: Freyssinet Adria was contracted to build the bridge in a joint venture with CGP Novo Mesto, being assigned responsibility for developing the construction method concept and designing and manufacturing the specialist temporary equipment needed to carry it out. Supply and installation of the tendons and erection of 46 precast deck units was also within the scope of works.
          - paragraph [ref=f21e116]: The use of grouted tendons – thought to be a world-first on this type of bridge – was proposed by the team following the collapse of a stress-ribbon bridge in Prague in 2017, to address potential concerns about durability. This improvement to the design demanded development and implementation of a new construction method.
          - paragraph [ref=f21e117]: The footbridge designer also specified that the deck elements be precast at least four months before installation, to ensure that any shrinkage of the concrete was largely complete.
          - paragraph [ref=f21e118]: Four of the six tendons, each consisting of 47 strands in an HDPE duct, were erected in the first part of the works. This began with 12 m-long sections of duct being clamped to hangers suspended from a steel wire between temporary portals on each bank.
          - paragraph [ref=f21e119]: Sections of duct were pulled out over the river one at a time, each being welded to the previous one, until the full length was in place. In order to ensure the strands remain parallel once threaded into the duct, which is critical for this type of structure, Freyssinet Adria used a specialist installation method that is usually adopted on cable-stay bridges.
          - paragraph [ref=f21e120]: A custom-built trolley for placing the deck segments was developed by Freyssinet, enabling each to be transported efficiently and safely to its final position. The trolley ran on the tendons, with eight sets of wheels designed to evenly distribute the load of the segment during this operation.
          - paragraph [ref=f21e121]: The two final tendons were then installed, followed by a sequence of deck concreting, tendon stressing and tendon grouting that was carefully planned and executed in line with the construction methodology.
          - paragraph [ref=f21e122]: Load testing to 70% of the footbridge’s design capacity was carried out using 18 lorries with a total weight of 70 t – deflection of just 130 mm was measured.
          - paragraph [ref=f21e123]:
            - img "Slovenia project Krka River" [ref=f21e124]
