            - heading "A wide range of bearings" [level=2] [ref=f13e104]
            - generic [ref=f13e105]:
              - paragraph [ref=f13e106]:
                - strong [ref=f13e107]: Freyssinet has developed a wide range of TETRON® bearings based on
                - strong [ref=f13e108]: five designs
                - text: ":"
              - list [ref=f13e109]:
                - listitem [ref=f13e110]: Elastomeric bearings
                - listitem [ref=f13e111]: Pot bearings
                - listitem [ref=f13e112]: Spherical bearings
                - listitem [ref=f13e113]: Guide and restraint bearings
                - listitem [ref=f13e114]: Linear rocker bearings
              - paragraph [ref=f13e115]:
                - strong [ref=f13e116]: Each design is available in
                - strong [ref=f13e117]: three operating modes
                - text: "allowing for different translational and rotational movements to suit the function of each structure:"
              - list [ref=f13e118]:
                - listitem [ref=f13e119]: Fixed
                - listitem [ref=f13e120]: Guided-sliding
                - listitem [ref=f13e121]: Free-sliding
              - paragraph [ref=f13e122]: All our bearings are CE Marked. They are custom made and can be designed and manufactured in accordance with various standards, the most common being EN1337 (Europe), BS 5400 (UK), AASHTO LRFD 2012 (US) and AS 5100 (Australia).
