          - heading "Bearings" [level=1] [ref=f13e75]
          - generic [ref=f13e77]: As mechanical parts that manage the inevitable movements of bridge structures, bearings are one of their most important structural components. The selection of the right bearing type for use requires the attention of a specialist. So does its installation, monitoring, maintenance and replacement.
          - text:  
