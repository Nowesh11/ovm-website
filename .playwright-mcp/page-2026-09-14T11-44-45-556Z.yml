        - text: / Bearings
      - tabpanel [ref=f13e86]:
        - generic [ref=f13e89]:
          - paragraph [ref=f13e92]: "The forces acting on bridges are multiple and of various origins: structure’s weight, shrinkage and creep, wind loads, temperature changes, traffic loads, horizontal loads such as accelerating, braking or skidding, impact forces due to collisions, support sagging, seismic forces, etc. Freyssinet bearings are designed to ensure that loads are transferred between the superstructure and the substructure and that they enable movement and rotation of the superstructure."
          - list [ref=f13e94]:
            - listitem [ref=f13e95]:
              - generic [ref=f13e96]:
                - generic [ref=f13e97]: Applications
                - generic [ref=f13e98]: Bridges Buildings Stadiums Water infrastructure Energy infrastructure
        - generic [ref=f13e101]:
