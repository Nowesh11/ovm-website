              - text: ", such as -but not limited to:"
            - list [ref=f13e162]:
              - listitem [ref=f13e163]: Various types of uplift bearings, including double-cap spherical bearings with a mechanism to support uplift loads in service
              - listitem [ref=f13e164]: Permanent “launch-over” bearings for erecting bridges using the incremental launching method
              - listitem [ref=f13e165]: Sliding pads for all types of sliding, launching or skidding operations, with improved sliding materials
