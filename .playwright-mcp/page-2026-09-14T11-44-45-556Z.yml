            - link "Tetron® pot bearings The structural rotations are adjusted thanks to an elastomeric pad, confined into a steel pot, which responds with high vertical stiffness and low rotation resistance. They are cost-effective for high vertical loads, and small to moderate horizontal loads. " [ref=f13e250] [cursor=pointer]:
