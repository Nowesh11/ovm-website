            - heading "From design to maintenance" [level=2] [ref=f13e196]
          - generic [ref=f13e198]:
            - generic [ref=f13e200]:
              - generic [ref=f13e204]:
                - heading "Assessment and design services" [level=3] [ref=f13e205]
                - paragraph [ref=f13e207]: A dedicated technical department (Atlante) assists you in the early stages of the project, to select the type of bearing best suited to the project and to size it, according to the needs of the structure and the budget available. This team, based in Italy, is made up of engineers and draftmen who are experts in structural and mechanical engineering, and use specific software providing 3D drawings.
              - generic [ref=f13e211]:
                - heading "Guarantee of the product performance and quality" [level=3] [ref=f13e212]
                - paragraph [ref=f13e214]: Our TETRON® bearings are manufactured in-house. We integrate all the necessary skills for bearing design, prototype testing, manufacturing, quality control and shipping. Our test centre, known as ISOLAB and located near the Bearing Technical Department in Italy, has the status of an official laboratory and has all the necessary equipment to carry out static and dynamic tests according to international standards.
              - generic [ref=f13e218]:
                - heading "Technical support or full installation" [level=3] [ref=f13e219]
                - paragraph [ref=f13e221]: Depending on your needs, we can provide technical assistance or proceed to the full installation of the bearings through our specialist teams around the world.
              - generic [ref=f13e225]:
                - heading "Inspection and maintenance" [level=3] [ref=f13e226]
                - paragraph [ref=f13e228]: A maintenance guide is provided for each delivery. It specifies the frequency of bearing inspection according to the characteristics of the structure and its environment, in order to optimize its service life. Freyssinet specialists are available to carry out these inspections.
                - link " " [ref=f13e229] [cursor=pointer]:
                  - /url: https://www.freyssinet.com/solution/repair/bearings-maintenance/
