        - generic [ref=f3e137]: Seismicisolation technology.Reduce structural responsethrough increasing structural damping, extending thenatural vibration period of structure,isolating seismicenergy to achieve excellent anti-seismic effect;
        - strong [ref=f3e142]: ·
        - generic [ref=f3e143]: Adopting seismicisolation technology.Compared withtraditionalanti-seismic structures, the acceleration ofisolated structures is only equivalent to 1/4~ 1/12 of theacceleration of traditional structures, greatly improvingsafety and reliability;
