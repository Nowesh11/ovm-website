      - paragraph [ref=f3e117]:
        - generic [ref=f3e118]: OVM leads the industry in bridge seismic isolation technology, focusing on providingcomprehensive solutions for bridge engineering from design to construction with onestop services. This includes efficient bearing systems, advanced expansion devices,and high-performance dampers. By integrating innovative engineering technology andexcellent manufacturing processes, we ensure structural safety and durability.
